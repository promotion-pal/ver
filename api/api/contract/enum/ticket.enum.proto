syntax = "proto3";

package contract.tickets.enum;

option go_package = "enum;enum_pb";

enum TicketType {
    TICKET_TYPE_UNKNOWN = 0;
    TICKET_TYPE_PLUMBER = 1;
}

enum TicketStatus {
    TICKET_STATUS_UNKNOWN = 0;
    TICKET_STATUS_PENDING = 1;
    TICKET_STATUS_APPROVED = 2;
    TICKET_STATUS_REJECTED = 3;
}