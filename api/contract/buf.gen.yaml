version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: dvgmu/ver/contract/gen/go

plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative

  - local: protoc-gen-connect-go
    out: gen/go
    opt: paths=source_relative

  - local: protoc-gen-es
    out: ../../packages/proto
    opt: target=js+dts
