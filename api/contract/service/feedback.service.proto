syntax = "proto3";

package contract.ver.service;

import "entity/feedback.entity.proto";
import "enum/feedback.enum.proto";

option go_package = "service;service_pb";

service FeedbackService {
    rpc FeedbackFetch (FeedbackFetchRequest) returns (FeedbackFetchResponse);
    rpc FeedbackCreate (FeedbackCreateRequest) returns (FeedbackCreateResponse);
    rpc FeedbackChangeStatus (FeedbackChangeStatusRequest) returns (FeedbackChangeStatusResponse);
}

// All filters are optional. Newest feedback first.
message FeedbackFetchRequest {
    optional string site_slug = 1;
    optional string version_id = 2;
    optional contract.ver.enum.FeedbackStatus status = 3;
}

message FeedbackFetchResponse {
    repeated contract.ver.entity.Feedback feedbacks = 1;
}

message FeedbackCreateRequest {
    string site_slug = 1;
    string site_name = 2;
    string version_id = 3;
    string version_label = 4;
    string author_name = 5;
    string phone = 6;
    contract.ver.enum.FeedbackAction action = 7;
    string comment = 8;
}

message FeedbackCreateResponse {
    int64 id = 1;
    bool success = 2;
    string message = 3;
}

message FeedbackChangeStatusRequest {
    int64 id = 1;
    contract.ver.enum.FeedbackStatus new_status = 2;
}

message FeedbackChangeStatusResponse {
    int64 id = 1;
    bool success = 2;
    string message = 3;
}
