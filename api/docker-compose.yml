services:
  dvgmu_apps_ticket_db:
    container_name: "dvgmu_apps_ticket_db"
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dvgmu_apps_ticket_pgdata:/var/lib/postgresql/data
    networks:
      - traefik-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  dvgmu_apps_ticket_api:
    container_name: "dvgmu_apps_ticket_api"
    build:
      context: "./api"
      dockerfile: "Dockerfile"
      network: host
    restart: unless-stopped
    depends_on:
      dvgmu_apps_ticket_db:
        condition: service_healthy
    environment:
      DB_HOST: ${POSTGRES_HOST:-dvgmu_apps_ticket_db}
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_SSLMODE: disable
      GRPC_PORT: "4000"
      TZ: ${TICKET_TZ:-Asia/Vladivostok}
    networks:
      - traefik-network

networks:
  traefik-network:
    external: true

volumes:
  dvgmu_apps_ticket_pgdata:
