services:
  ver_db:
    container_name: "ver_db"
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ver_pgdata:/var/lib/postgresql/data
    networks:
      - traefik-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ver_api:
    container_name: "ver_api"
    build:
      context: "."
      dockerfile: "Dockerfile"
      network: host
    restart: unless-stopped
    depends_on:
      ver_db:
        condition: service_healthy
    environment:
      DB_HOST: ${POSTGRES_HOST:-ver_db}
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_SSLMODE: disable
      GRPC_PORT: "4000"
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:?ACCESS_PASSWORD is required}
      TZ: ${API_TZ:-Asia/Vladivostok}
    networks:
      - traefik-network

networks:
  traefik-network:
    external: true

volumes:
  ver_pgdata:
