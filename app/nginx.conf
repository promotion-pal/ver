server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Connect/gRPC API. The upstream is resolved per request through Docker's
    # DNS, so nginx still starts when the API container is not up yet.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://ver_api:4000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
